  <!-- Design Notes Section -->
  <rect class="card" x="60" y="2190" width="1080" height="580" rx="12"/>
  <text class="text-heading" x="80" y="2230">Design Concept 3: Chapter-Based Organization</text>

  <text class="text-title" x="80" y="2270">Key Features:</text>
  <text class="text-body" x="100" y="2300">• Thematic Grouping: Posts organized into logical chapters/phases</text>
  <text class="text-body" x="100" y="2325">• Progress Tracking: Visual indicator of read posts (requires backend)</text>
  <text class="text-body" x="100" y="2350">• Chapter Navigation: Jump directly to relevant sections</text>
  <text class="text-body" x="100" y="2375">• Story Arc: Emphasizes the narrative journey of the build</text>
  <text class="text-body" x="100" y="2400">• Collapsible Sections: Can expand/collapse chapters (not shown in wireframe)</text>

  <text class="text-title" x="80" y="2440">Advantages:</text>
  <text class="text-body" x="100" y="2470">✓ Natural organization for series with distinct phases</text>
  <text class="text-body" x="100" y="2495">✓ Helps readers find specific topics easily</text>
  <text class="text-body" x="100" y="2520">✓ Reduces cognitive load - 4 chapters vs 18 individual posts</text>
  <text class="text-body" x="100" y="2545">✓ Can track progress through the series</text>
  <text class="text-body" x="100" y="2570">✓ Works well for sequential reading</text>

  <text class="text-title" x="80" y="2610">Best For:</text>
  <text class="text-body" x="100" y="2640">• Series meant to be read sequentially</text>
  <text class="text-body" x="100" y="2665">• Build logs with clear development phases</text>
  <text class="text-body" x="100" y="2690">• Educational content with progressive difficulty</text>

  <text class="text-title" x="80" y="2730">Technical Notes:</text>
  <text class="text-body" x="100" y="2760">• Add "chapter" field to blog frontmatter metadata</text>
</svg>
