  <text class="text-label" x="80" y="145">PART 1</text>
  <text class="text-heading" x="80" y="175">Genesis - Why Build This?</text>
  <text class="text-body" x="80" y="205">The problem: dozens of abandoned game projects, all stuck at asset creation.</text>
  <text class="text-body" x="80" y="223">Not because I couldn't code the mechanics, but because I couldn't create,</text>
  <text class="text-body" x="80" y="241">afford, or justify spending weeks on the hundreds of assets needed.</text>
  <text class="text-body" x="80" y="271">This is the story of how I used AI to solve this problem - and why I'm</text>
  <text class="text-body" x="80" y="289">building it in public for other indie devs facing the same challenge.</text>

  <!-- Tech stack pills -->
  <rect class="tech-tag" x="80" y="320" width="70" height="22" rx="11"/>
  <text class="tech-text" x="95" y="335" text-anchor="middle">Next.js</text>

  <rect class="tech-tag" x="160" y="320" width="90" height="22" rx="11"/>
  <text class="tech-text" x="205" y="335" text-anchor="middle">Product Dev</text>

  <rect class="tech-tag" x="260" y="320" width="75" height="22" rx="11"/>
  <text class="tech-text" x="297" y="335" text-anchor="middle">Strategy</text>

