  <!-- Background -->
  <rect class="bg" width="1200" height="3200"/>

  <!-- Page Title -->
  <text class="text-heading" x="60" y="60">Building Asset Hatch</text>
  <text class="text-body" x="60" y="85">18-part series: Building a production AI asset generator</text>

  <!-- Featured Hero Post -->
  <rect class="card-featured" x="60" y="120" width="730" height="380" rx="12"/>

  <!-- Subtle featured star (top right corner) -->
