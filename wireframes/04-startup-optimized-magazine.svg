  <text class="text-label" x="650" y="625">PART 3</text>
  <text class="text-title" x="650" y="650">The Crisis - When Frameworks Fail</text>
  <text class="text-body" x="650" y="675">What happens when your carefully chosen framework hits a wall?</text>
  <text class="text-body" x="650" y="693">This post explores the critical moment everything broke and the</text>
  <text class="text-body" x="650" y="711">difficult decision to rebuild from scratch.</text>
  <text class="text-body" x="650" y="743">Key learnings:</text>
  <text class="text-body" x="670" y="768">• When to pivot vs. push through</text>
  <text class="text-body" x="670" y="788">• Evaluating technical debt trade-offs</text>
  <text class="text-body" x="670" y="808">• Managing stakeholder expectations during rewrites</text>

  <rect class="tech-tag" x="650" y="835" width="80" height="20" rx="10"/>
  <text class="tech-text" x="690" y="849" text-anchor="middle">Leadership</text>

  <text class="text-meta" x="650" y="865">⏱ 9 min read</text>

