  <text class="text-title" x="80" y="1230">Payment Integration & Billing</text>
  <text class="text-body" x="80" y="1255">Implementing Stripe for SaaS subscriptions, webhook handling,</text>
  <text class="text-body" x="80" y="1273">and managing complex billing edge cases.</text>

