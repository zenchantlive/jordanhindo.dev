  <!-- Design Notes -->
  <rect class="card" x="60" y="1700" width="1080" height="1460" rx="12"/>
  <text class="text-heading" x="80" y="1740">Startup-Optimized Magazine Layout</text>

  <text class="text-title" x="80" y="1780">Design Principles:</text>
  <text class="text-body" x="100" y="1810">• Professional & Clean: No casual badges, subtle featured indicators only</text>
  <text class="text-body" x="100" y="1835">• Tech-Forward: Visible tech stack on every card for quick scanning</text>
  <text class="text-body" x="100" y="1860">• Visual Hierarchy: Card size shows importance without labels</text>
  <text class="text-body" x="100" y="1885">• Flexible Layout: Adapts to different series lengths (7, 14, 18 posts)</text>
  <text class="text-body" x="100" y="1910">• Startup Signals: Shipping, technical depth, problem-solving</text>

  <text class="text-title" x="80" y="1950">Featured Indicator:</text>
  <circle class="featured-star" cx="100" cy="1975" r="8"/>
  <text class="text-body" x="120" y="1980">Subtle purple star in top-right corner</text>
  <text class="text-body" x="100" y="2005">• Minimal, professional</text>
  <text class="text-body" x="100" y="2030">• Draws eye without being loud</text>
  <text class="text-body" x="100" y="2055">• Use sparingly (3-5 posts max per series)</text>

  <text class="text-title" x="80" y="2095">What Gets Featured:</text>
  <text class="text-body" x="100" y="2125">For startup job-seeking, feature posts showing:</text>
  <text class="text-body" x="120" y="2150">1. Problem-solving & product thinking (Part 1, 3)</text>
  <text class="text-body" x="120" y="2175">2. Technical depth & architecture (Part 5, 15)</text>
  <text class="text-body" x="120" y="2200">3. Shipping & production skills (Part 16)</text>
  <text class="text-body" x="120" y="2225">4. Full-stack capabilities (Database, Auth, Payments)</text>

  <text class="text-title" x="80" y="2265">Tech Stack Pills:</text>
  <rect class="tech-tag" x="100" y="2280" width="70" height="22" rx="11"/>
  <text class="tech-text" x="135" y="2295" text-anchor="middle">Next.js</text>
  <rect class="tech-tag" x="180" y="2280" width="60" height="22" rx="11"/>
  <text class="tech-text" x="210" y="2295" text-anchor="middle">Stripe</text>

  <text class="text-body" x="100" y="2330">• Shows skills at a glance</text>
  <text class="text-body" x="100" y="2355">• Helps recruiters/founders find relevant experience</text>
  <text class="text-body" x="100" y="2380">• Blue accent (not purple) for differentiation</text>
  <text class="text-body" x="100" y="2405">• 1-3 tags per post maximum</text>

  <text class="text-title" x="80" y="2445">Adapting for Different Series:</text>

  <text class="text-subhead" x="100" y="2480">Asset Hatch (18 posts):</text>
  <text class="text-body" x="120" y="2510">• 3 sections: Foundation, Production Features, remaining compact</text>
  <text class="text-body" x="120" y="2535">• Feature: Part 1, 3, 5, 15, 16</text>
  <text class="text-body" x="120" y="2560">• Emphasize: Full-stack skills, shipping production app</text>

  <text class="text-subhead" x="100" y="2600">TheFeed (14 posts):</text>
  <text class="text-body" x="120" y="2630">• 2 sections: Core Development, Production</text>
  <text class="text-body" x="120" y="2655">• Feature: Posts showing social features, real-time data, scaling</text>
  <text class="text-body" x="120" y="2680">• Emphasize: Product thinking, user-facing features</text>

  <text class="text-subhead" x="100" y="2720">Catwalk Live (7 posts):</text>
  <text class="text-body" x="120" y="2750">• 1-2 sections: Simple chronological or thematic grouping</text>
  <text class="text-body" x="120" y="2775">• Feature: 2-3 key technical posts</text>
  <text class="text-body" x="120" y="2800">• All posts more prominent due to smaller total</text>

  <text class="text-title" x="80" y="2840">Mobile Responsive:</text>
  <text class="text-body" x="100" y="2870">• All cards full-width</text>
  <text class="text-body" x="100" y="2895">• Maintain vertical order</text>
  <text class="text-body" x="100" y="2920">• Featured star stays visible</text>
  <text class="text-body" x="100" y="2945">• Tech tags wrap to multiple lines if needed</text>

  <text class="text-title" x="80" y="2985">Implementation Notes:</text>
  <text class="text-body" x="100" y="3015">• Add 'featured: true' to frontmatter for selected posts</text>
  <text class="text-body" x="100" y="3040">• Add 'techStack: ["Next.js", "Stripe"]' array to frontmatter</text>
  <text class="text-body" x="100" y="3065">• Use CSS Grid with grid-template-areas for flexible layouts</text>
  <text class="text-body" x="100" y="3090">• Section headers defined in blog series metadata</text>
  <text class="text-body" x="100" y="3115">• Keep existing glass-card aesthetic with subtle gradients</text>
</svg>
