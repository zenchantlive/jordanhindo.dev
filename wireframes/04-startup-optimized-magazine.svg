  <text class="text-label" x="80" y="625">PART 5</text>
  <text class="text-title" x="80" y="650">Building the Generation Engine</text>
  <text class="text-body" x="80" y="675">The technical heart of Asset Hatch: building a prompt-based asset generation</text>
  <text class="text-body" x="80" y="693">engine that creates consistent, high-quality game assets at scale.</text>

  <rect class="tech-tag" x="80" y="720" width="90" height="20" rx="10"/>
