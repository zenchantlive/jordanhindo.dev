      .text-label { fill: #a855f7; font-family: Arial, sans-serif; font-size: 10px; font-weight: bold; }
      .tech-tag { fill: #1a1a1a; stroke: #3b82f6; stroke-width: 1; }
      .tech-text { fill: #3b82f6; font-family: Arial, sans-serif; font-size: 9px; }
      .featured-star { fill: #a855f7; }
      .button { fill: #a855f7; }
      .button-outline { fill: none; stroke: #a855f7; stroke-width: 2; }
      .button-text { fill: #ffffff; font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; }
      .button-text-outline { fill: #a855f7; font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; }
